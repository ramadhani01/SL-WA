<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gabung saluran WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e3eee6;
  --card: #fbfdf9;
  --ink: #15291f;
  --muted: #5b7266;
  --accent: #1c9b50;
  --accent-ink: #ffffff;
  --shadow: 0 24px 48px -24px rgba(21, 41, 31, .35);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1b14;
    --card: #162a1f;
    --ink: #e8f3ec;
    --muted: #93ab9c;
    --accent: #4be08a;
    --accent-ink: #082414;
    --shadow: 0 24px 48px -24px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1b14;
  --card: #162a1f;
  --ink: #e8f3ec;
  --muted: #93ab9c;
  --accent: #4be08a;
  --accent-ink: #082414;
  --shadow: 0 24px 48px -24px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid;
  place-items: center;
  padding: 24px;
}

.bubble {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  border-radius: 32px 32px 32px 8px;
  padding: 40px 32px 32px;
  box-shadow: var(--shadow);
  animation: pop .55s cubic-bezier(.2, 1.3, .4, 1) both;
  transform-origin: 0 100%;
}
@keyframes pop {
  from { opacity: 0; transform: scale(.88); }
  to   { opacity: 1; transform: scale(1); }
}

h1 {
  margin: 0 0 12px;
  font-size: clamp(2.4rem, 11vw, 3.1rem);
  line-height: 1;
  font-weight: 800;
  letter-spacing: -.035em;
}
p {
  margin: 0 0 28px;
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.5;
}

.join {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 24px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font: inherit;
  font-weight: 600;
  font-size: 1.1rem;
  text-decoration: none;
  transition: transform .15s ease, filter .15s ease;
}
.join:hover { filter: brightness(1.06); }
.join:active { transform: scale(.97); }
.join:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.join svg { width: 22px; height: 22px; flex: none; }

.note {
  margin: 16px 0 0;
  text-align: center;
  font-size: .9rem;
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  .bubble { animation: none; }
  .join { transition: none; }
}
</style>
</head>
<body>
<main class="bubble">
  <h1>Gabung ke saluran terlebih dahulu</h1>
  <p>Untuk mendapatkan link video yang dituju.</p>
  <!-- FILL: ganti FILL di bawah dengan kode saluran, ambil dari WhatsApp > saluran > bagikan > salin link -->
  <a class="join" id="join" href="https://whatsapp.com/channel/0029VbESt7p2UPBAqtbNEi0I" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M9 10.5c.5 2 2.500 4 4.500 4.500l1.300-1.300-2-1-.8.7c-.9-.4-1.600-1.100-2-2l.7-.8-1-2z" fill="currentColor" stroke="none"/></svg>
    Gabung saluran
  </a>
</main>
</body>
</html>
